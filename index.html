<script>

// Real Counter - Increase + Show
async function updateRealCounter(){
  try{
    // Increase count

    // Get count
    const r = await fetch('https://api.counterapi.dev/v1/gold-price-today-eight-2026/visits');
    const d = await r.json();
    document.getElementById('liveViews').innerText = d.count;
    document.getElementById('sideViews').innerText = d.count;
  }catch(e){
    document.getElementById('liveViews').innerText = "Live";
  }
}
updateRealCounter();
