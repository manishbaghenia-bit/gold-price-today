<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold CMS Ultimate - Post Dalo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:Inter,sans-serif;padding:20px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:20px}
h2{color:#f5c542;margin-bottom:15px}
label{display:block;margin:10px 0 5px;color:#aaa;font-size:14px}
input,textarea,select{width:100%;background:#222;border:1px solid #444;color:#fff;padding:12px;border-radius:8px}
button{background:linear-gradient(135deg,#f5c542,#ff9800);color:#000;border:none;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.price-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.small{font-size:12px;color:#888;margin-top:8px}
</style>
</head>
<body>
<h1 style="text-align:center;margin-bottom:20px">🪙 Gold CMS Ultimate</h1>

<div class="card">
<h2>STEP 1: Live Price (Fixed)</h2>
<div class="price-row">
<div><label>24K (10g)</label><input id="p24" placeholder="₹62,000"></div>
<div><label>22K (10g)</label><input id="p22" placeholder="₹58,500"></div>
<div><label>18K (10g)</label><input id="p18" placeholder="₹46,500"></div>
</div>
<label>Status</label><input id="apiStatus" readonly placeholder="Manual bhi bhar sakte ho">
<button onclick="fetchLivePrice()">🔴 Live Price Lao (Naya API)</button>
<p class="small">Tip: Agar live thoda upar-neeche lage to Google pe "Gold price Delhi today" dekh ke manual edit kar sakta hai.</p>
</div>

<div class="card">
<h2>STEP 2: Post Details</h2>
<label>Date</label><input id="postDate" type="date">
<label>Title</label><input id="postTitle" placeholder="Gold Price in Delhi Today - 22K, 24K...">
<label>Meta Description</label><textarea id="metaDesc" rows="2"></textarea>
<label>Slug (file name)</label><input id="slug" placeholder="gold-price-delhi-today">
</div>

<div class="card">
<h2>STEP 3: Content Editor</h2>
<textarea id="editor" rows="15" placeholder="<h2>Aaj ka bhav...</h2>"></textarea>
<button onclick="generateAI()">🤖 AI Writer</button>
</div>

<div class="card">
<button onclick="publishPost()" style="font-size:18px;padding:18px;background:linear-gradient(135deg,#00e676,#00c853)">🚀 POST DALO / PUBLISH KARO</button>
</div>

<script>
document.getElementById('postDate').valueAsDate = new Date();
async function fetchLivePrice(){
  const status = document.getElementById('apiStatus');
  status.value='Fetching...';
  try{
    let goldRes = await fetch('https://api.gold-api.com/price/XAU');
    let goldData = await goldRes.json();
    let xauPrice = goldData.price;
    let fxRes = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    let fxData = await fxRes.json();
    let inrRate = fxData.rates.INR;
    if(!xauPrice || !inrRate) throw new Error('fail');
    let perGramINR = (xauPrice * inrRate) / 31.1035;
    let price24 = Math.round(perGramINR * 10);
    let price22 = Math.round(price24 * 0.916);
    let price18 = Math.round(price24 * 0.75);
    document.getElementById('p24').value = '₹' + price24.toLocaleString('en-IN');
    document.getElementById('p22').value = '₹' + price22.toLocaleString('en-IN');
    document.getElementById('p18').value = '₹' + price18.toLocaleString('en-IN');
    status.value = 'Live ✅ 1oz=$' + xauPrice.toFixed(2) + ' | $1=₹' + inrRate.toFixed(2);
  }catch(e){
    status.value='API fail - Manual bharo';
    alert('Live API fail. Google se dekh ke manual bhar do.');
  }
}
function generateAI(){
  let p22 = document.getElementById('p22').value || '₹58,500';
  let p24 = document.getElementById('p24').value || '₹62,000';
  let date = document.getElementById('postDate').value;
  let title = document.getElementById('postTitle').value || 'Gold Price in Delhi Today';
  document.getElementById('editor').value = `<h2>${title} - ${date}</h2><p>Delhi me aaj <strong>24K ${p24}/10g</strong> aur <strong>22K ${p22}/10g</strong>.</p><h3>Chart</h3><ul><li>24K: ${p24}</li><li>22K: ${p22}</li><li>18K: ${document.getElementById('p18').value}</li></ul>`;
}
function publishPost(){
  let date=document.getElementById('postDate').value;
  let title=document.getElementById('postTitle').value;
  let meta=document.getElementById('metaDesc').value;
  let slug=document.getElementById('slug').value || 'gold-price-'+date;
  let content=document.getElementById('editor').value;
  if(!title||!content){alert('Title/Content bharo');return;}
  let html=`<!DOCTYPE html><html><head><title>${title}</title><meta name="description" content="${meta}"></head><body><h1>${title}</h1>${content}</body></html>`;
  let blob=new Blob([html],{type:'text/html'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slug+'.html';a.click();
}
</script>
</body>
</html>
