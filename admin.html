<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Final - WP + Writer</title><style>body{background:#f0f2f5;font-family:Arial;margin:0;padding:15px}.box{max-width:750px;background:#fff;margin:20px auto;padding:20px;border-radius:12px}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}label{font-weight:bold;font-size:14px;margin-top:10px;display:block}.btn{width:100%;padding:14px;color:#fff;font-weight:bold;margin-top:10px;border:0;border-radius:8px;cursor:pointer}.green{background:#25D366}.blue{background:#2196F3}.black{background:#000}.orange{background:#ff9800}.hide{display:none}.dash{border:2px dashed #ff9800;padding:15px;border-radius:12px;margin:15px 0;background:#fff8ed}</style></head><body>
<div class="box" id="L"><h2 style="text-align:center">🔐 Login</h2><input id="uid" placeholder="ID - mannu gola"><input id="upass" type="password" placeholder="Password"><button class="btn orange" onclick="login()">Login</button><p id="err" style="color:red;text-align:center"></p></div>

<div class="box hide" id="P">
<h2 id="welcome" style="text-align:center"></h2><center><a href="#" onclick="location.reload()">Logout</a></center>

<div id="adminBox" class="hide dash">
<h3>👑 Writer Banao (Bina Code Ke)</h3>
<label>GitHub Token (ghp_...)</label><input id="gtoken" type="password" placeholder="Token yahan dalo">
<label>Writer Ka Naam</label><input id="wname" placeholder="Jaise Raju, Amit">
<button class="btn black" onclick="createWriter()">✨ Writer ID Banao & Auto Save</button>
<p id="wout" style="background:#e8f5e9;padding:10px;border-radius:8px;word-break:break-all"></p><div id="writerList"></div>
<hr><button class="btn orange" onclick="loadPending()">📥 Pending Posts Dekho (Writer ne bheje)</button><div id="pendingList"></div>
</div>

<h3 style="text-align:center">📝 WordPress Editor</h3>
<label>Image URL</label><input id="fimg" placeholder="https://...">
<label>Category</label><select id="cat"><option>Sona-Chandi</option><option>Gold Price</option><option>Silver Price</option><option>News</option><option>Tips</option></select>
<label>Author</label><input id="author" value="Manish Kumar">
<label>Title</label><input id="title" oninput="slugMake()" placeholder="Title likho">
<label>SEO Description</label><input id="seo" placeholder="SEO desc">
<label>Tags</label><input id="tags" placeholder="gold price, delhi" value="gold price, delhi">
<label>File Name</label><input id="slug" placeholder="file-name.html">

<label>Content</label><textarea id="content" rows="12" placeholder="Post ka content yahan likho..."></textarea>

<button id="pubBtn" class="btn green hide" onclick="publishDirect()">🚀 DIRECT PUBLISH - Admin Only</button>
<button id="writerBtn" class="btn blue hide" onclick="sendPending()">📩 Approval Ke Liye Bhejo - Writer</button>
<p id="msg" style="text-align:center;font-weight:bold"></p>
</div>

<script>
let writersCache={}, writersSha=null, currentUser=null, currentRole=null;
const ADMIN={id:"mannu gola", pass:"baghenia@7409"};
async function loadWriters(){try{let r=await fetch(`https://api.github.com/repos/mannu-gola/gold-price-today/contents/writers.json?ts=${Date.now()}`); if(r.ok){let j=await r.json(); writersSha=j.sha; writersCache=JSON.parse(atob(j.content)||'{}');}}catch(e){writersCache={};}}
async function login(){
 await loadWriters();
 let a=document.getElementById('uid').value.trim(); let b=document.getElementById('upass').value.trim();
 if(a===ADMIN.id && b===ADMIN.pass){currentUser=a; currentRole='admin';}
 else if(writersCache[a] && writersCache[a]===b){currentUser=a; currentRole='writer';}
 else{document.getElementById('err').innerText='Galat ID/Password'; return;}
 document.getElementById('L').classList.add('hide'); document.getElementById('P').classList.remove('hide');
 document.getElementById('welcome').innerText=currentRole=='admin'?`👑 Admin: ${a}`:`✍️ Writer: ${a}`;
 if(currentRole=='admin'){document.getElementById('adminBox').classList.remove('hide'); document.getElementById('pubBtn').classList.remove('hide'); listWriters();}
 else{document.getElementById('writerBtn').classList.remove('hide');}
 let t=localStorage.getItem('gh_token'); if(t) document.getElementById('gtoken').value=t;
}
function slugMake(){let s=document.getElementById('title').value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); document.getElementById('slug').value=s+'.html';}
function getHtml(){
 let t=document.getElementById('title').value, ca=document.getElementById('cat').value, au=document.getElementById('author').value||currentUser, se=document.getElementById('seo').value, ta=document.getElementById('tags').value, fi=document.getElementById('fimg').value, c=document.getElementById('content').value.replace(/\n/g,'<br>');
 let im=fi?`<img src="${fi}" style="width:100%;border-radius:10px;margin:10px 0">`:'';
 return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${t}</title><meta name="description" content="${se}"><meta name="keywords" content="${ta}"><style>body{max-width:800px;margin:auto;padding:20px;font-family:Arial;line-height:1.7}</style></head><body><a href="/">← Home</a><h1>${t}</h1><p style="color:gray">${ca} | By ${au} | ${new Date().toLocaleDateString()} | ${ta}</p>${im}<div>${c}</div><hr><p>${se}</p></body></html>`;
}
function listWriters(){let h='<b>Existing Writers:</b><br>'; for(let k in writersCache){h+=`👤 ${k} | Pass: ${writersCache[k]}<br>`;} document.getElementById('writerList').innerHTML=h;}
async function createWriter(){
 let token=document.getElementById('gtoken').value.trim(); if(!token){alert('Token dalo');return;} localStorage.setItem('gh_token',token);
 let name=document.getElementById('wname').value.trim(); if(!name){alert('Naam likho');return;}
 let id=name.toLowerCase().replace(/\s+/g,'')+'_writer'; let pass=name.charAt(0).toUpperCase()+name.slice(1)+'@'+Math.floor(100+Math.random()*900)+'!';
 await loadWriters(); writersCache[id]=pass;
 let content=btoa(unescape(encodeURIComponent(JSON.stringify(writersCache,null,2))));
 let url=`https://api.github.com/repos/mannu-gola/gold-price-today/contents/writers.json`;
 let body={message:`Add writer ${id}`, content:content}; if(writersSha) body.sha=writersSha;
 document.getElementById('wout').innerText='Saving...';
 let res=await fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(res.ok){document.getElementById('wout').innerHTML=`✅ Ban Gaya!<br>ID: <b>${id}</b><br>Pass: <b>${pass}</b>`; listWriters(); writersSha=(await res.json()).content.sha;}else{document.getElementById('wout').innerText='Error - Token check karo';}
}
async function publishDirect(){
 let token=document.getElementById('gtoken').value.trim(); if(!token){alert('Token dalo');return;}
 let slug=document.getElementById('slug').value.trim(); if(!slug.endsWith('.html'))slug+='.html';
 let html=getHtml(); document.getElementById('msg').innerText='Publishing...';
 let url=`https://api.github.com/repos/mannu-gola/gold-price-today/contents/blog/${slug}`;
 let res=await fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Admin publish '+slug, content:btoa(unescape(encodeURIComponent(html)))})});
 document.getElementById('msg').innerText=res.ok?'🎉 LIVE Ho Gaya!':'Error: File naam badlo';
}
async function sendPending(){
 let token=document.getElementById('gtoken').value.trim(); if(!token){token=prompt('Token dalo');}
 let slug=document.getElementById('slug').value.trim(); if(!slug.endsWith('.html'))slug+='.html';
 let html=getHtml(); let url=`https://api.github.com/repos/mannu-gola/gold-price-today/contents/pending/${slug}`;
 let res=await fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:`Writer ${currentUser} pending ${slug}`, content:btoa(unescape(encodeURIComponent(html)))})});
 document.getElementById('msg').innerText=res.ok?'✅ Admin ko bhej diya!':'Error';
}
async function loadPending(){
 let token=document.getElementById('gtoken').value.trim(); if(!token){alert('Token dalo');return;}
 let url=`https://api.github.com/repos/mannu-gola/gold-price-today/contents/pending`;
 let res=await fetch(url,{headers:{'Authorization':'token '+token}}); if(!res.ok){document.getElementById('pendingList').innerText='Koi pending nahi';return;}
 let data=await res.json(); let h=''; data.forEach(f=>{if(f.name!=='.gitkeep') h+=`<p>📄 ${f.name} - <a href="${f.html_url}" target="_blank">Code Dekho</a></p>`}); document.getElementById('pendingList').innerHTML=h||'Koi pending nahi';
}
</script></body></html>
