<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldPriceToday - Premium Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui;background:#080808;color:#fff}
.gold{background:linear-gradient(135deg,#D4AF37,#F9E27A,#B8941F)}
.gold-text{background:linear-gradient(135deg,#D4AF37,#F9E27A);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.glass{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.15);backdrop-filter:blur(20px)}
</style>
</head>
<body>
<script>
const ADMIN_KEY="mannu@123";
if(sessionStorage.getItem('gold_admin_ok')!=='yes'){
  let p=prompt("🔐 GoldPriceToday Premium Admin\n\nEnter Secret Key:");
  if(p!==ADMIN_KEY){
    alert("❌ Access Denied!");
    window.location.href="/index.html";
  } else {
    sessionStorage.setItem('gold_admin_ok','yes');
  }
}
</script>
<div class="flex min-h-screen">
  <div class="w-[280px] bg-[#0F0F0F] border-r border-[#D4AF37]/20 p-6 hidden md:flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 mb-10">
        <div class="w-11 h-11 gold rounded-2xl flex items-center justify-center text-black font-bold">G</div>
        <div><h1 class="font-bold">GoldPriceToday</h1><p class="text-[10px] text-[#D4AF37] tracking-widest">PREMIUM ADMIN</p></div>
      </div>
      <nav class="space-y-2">
        <a class="flex gap-3 px-4 py-3 rounded-xl gold text-black font-bold">⚙️ Reading Settings</a>
        <a href="/index.html" class="flex gap-3 px-4 py-3 rounded-xl text-gray-400">🌐 View Site</a>
      </nav>
    </div>
    <div class="text-[11px] text-gray-500">© 2026 Manish • mannu@123</div>
  </div>
  <div class="flex-1">
    <div class="h-[76px] bg-[#0F0F0F]/80 border-b border-[#D4AF37]/10 flex justify-between items-center px-8 sticky top-0">
      <h2 class="text-2xl font-semibold">Reading Settings</h2>
      <button onclick="saveSettings()" class="gold text-black font-bold px-6 py-2.5 rounded-full">💾 Save</button>
    </div>
    <div class="p-8 grid grid-cols-12 gap-6">
      <div class="col-span-12 grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="glass rounded-[20px] p-5"><p class="text-[10px] text-gray-400">24K LIVE</p><p class="text-xl font-bold gold-text mt-2">₹7,185 / g</p></div>
        <div class="glass rounded-[20px] p-5"><p class="text-[10px] text-gray-400">CITIES</p><p class="text-xl font-bold mt-2" id="cityDisplay">10 Cities</p></div>
        <div class="glass rounded-[20px] p-5"><p class="text-[10px] text-gray-400">SEO</p><p class="text-xl font-bold mt-2">Indexed ✓</p></div>
        <div class="glass rounded-[20px] p-5"><p class="text-[10px] text-gray-400">SECURITY</p><p class="text-xl font-bold mt-2">mannu@123 🔒</p></div>
      </div>
      <div class="col-span-12 lg:col-span-8 glass rounded-[24px] p-8">
        <h3 class="font-semibold mb-6">Homepage Configuration</h3>
        <div class="space-y-6">
          <label class="flex gap-4 p-4 rounded-2xl bg-white/[0.03] border border-white/10"><input type="radio" name="home" value="posts" checked> <span><b>Your latest gold rates</b></span></label>
          <div class="flex justify-between p-5 rounded-2xl bg-white/[0.03] border border-white/10"><p>Show at most</p><div class="flex gap-2 items-center"><input id="cityCount" type="number" value="10" class="bg-[#1A1A1A] border border-white/10 rounded-xl h-11 w-20 text-center font-bold text-[#D4AF37]"> cities</div></div>
          <button onclick="saveSettings()" class="w-full gold text-black font-bold h-12 rounded-full">Save Changes - mannu@123 Protected</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast" class="fixed bottom-6 right-6 bg-[#1A1A1A] border border-[#D4AF37]/30 px-6 py-3 rounded-full text-sm hidden">✅ Saved!</div>
<script>
function saveSettings(){const c=document.getElementById('cityCount').value;localStorage.setItem('goldReadingSettings',JSON.stringify({cities:c}));document.getElementById('cityDisplay').innerText=c+' Cities';const t=document.getElementById('toast');t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000)}
</script>
</body>
</html>
