<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Final</title><style>body{background:#f0f2f5;font-family:Arial;margin:0;padding:15px}.box{max-width:700px;background:#fff;margin:20px auto;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.05)}input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}label{font-weight:bold;font-size:13px;margin-top:8px;display:block}.btn{width:100%;padding:13px;background:#ff9800;color:#fff;font-weight:bold;margin-top:10px;border:0;border-radius:8px;cursor:pointer}.green{background:#25D366}.blue{background:#2196F3}.black{background:#000}.hide{display:none}.dash{border:2px dashed #ff9800;padding:12px;border-radius:10px;margin:15px 0;background:#fff8ed}</style></head><body>
<div class="box" id="L"><h2 style="text-align:center">🔐 Login</h2><input id="uid" placeholder="Enter ID"><input id="upass" type="password" placeholder="Enter Password"><button class="btn" onclick="login()">Login</button><p id="err" style="color:red;text-align:center"></p></div>
<div class="box hide" id="P">
<h2 id="welcome" style="text-align:center"></h2><center><a href="#" onclick="location.reload()">Logout</a></center>
<div id="adminBox" class="hide dash">
<h3>👑 Writer Banao (Bina Code Ke)</h3>
<label>GitHub Token (ghp_...)</label><input id="gtoken" type="password" placeholder="Token yahan dalo - ek baar hi">
<label>Writer Ka Naam</label><input id="wname" placeholder="Jaise Raju, Amit">
<button class="btn black" onclick="createWriter()">✨ Writer ID Banao & Auto Save</button>
<p id="wout" style="background:#e8f5e9;padding:10px;border-radius:8px;word-break:break-all"></p><div id="writerList" style="font-size:13px"></div>
</div>
<label>Image URL</label><input id="fimg" placeholder="https://..."><label>Title</label><input id="title" oninput="slugMake()" placeholder="Title likho"><label>File Name</label><input id="slug" placeholder="auto banega"><label>Content</label><textarea id="content" rows="8" placeholder="Post ka content"></textarea>
<button id="pubBtn" class="btn green hide" onclick="publishDirect()">🚀 DIRECT PUBLISH - Admin Only</button>
<button id="writerBtn" class="btn blue hide" onclick="sendPending()">📩 Admin Approval Ke Liye Bhejo - Writer</button>
<p id="msg" style="text-align:center;font-weight:bold;color:green"></p>
</div>
<script>
let writersCache={}; let writersSha=null; let currentUser=null; let currentRole=null;
const ADMIN={id:"mannu gola", pass:"baghenia@7409"};
async function loadWriters(){try{let r=await fetch(`https://api.github.com/repos/mannu-gola/gold-price-today/contents/writers.json?timestamp=${Date.now()}`,{headers:{'Cache-Control':'no-cache'}}); if(r.ok){let j=await r.json(); writersSha=j.sha; let txt=atob(j.content); writersCache=JSON.parse(txt||'{}');}}catch(e){writersCache={};}}
async function login(){await loadWriters(); let a=document.getElementById('uid').value.trim(); let b=document.getElementById('upass').value.trim(); if(a===ADMIN.id && b===ADMIN.pass){currentUser=a; currentRole='admin';}else if(writersCache[a] && writersCache[a]===b){currentUser=a; currentRole='writer';}else{document.getElementById('err').innerText='Galat ID/Password! writers.json check karo'; return;} document.getElementById('L').classList.add('hide'); document.getElementById('P').classList.remove('hide'); document.getElementById('welcome').innerText=currentRole=='admin'?`👑 Admin: ${a}`:`✍️ Writer: ${a}`; if(currentRole=='admin'){document.getElementById('adminBox').classList.remove('hide'); document.getElementById('pubBtn').classList.remove('hide'); listWriters();}else{document.getElementById('writerBtn').classList.remove('hide');} let t=localStorage.getItem('gh_token'); if(t) document.getElementById('gtoken').value=t;}
function slugMake(){let s=document.getElementById('title').value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); document.getElementById('slug').value=s+'.html';}
function getHtml(){let t=document.getElementById('title').value; let c=document.getElementById('content').value.replace(/\n/g,'<br>'); let fi=document.getElementById('fimg').value; let im=fi?`<img src="${fi}" style="width:100%;border-radius:10px">`:''; return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${t}</title></head><body style="max-width:800px;margin:auto;padding:20px;font-family:Arial"><a href="/">Home</a><h1>${t}</h1><p>By ${currentUser} | ${new Date().toLocaleDateString()}</p>${im}<div>${c}</div></body></html>`;}
function listWriters(){let h='<hr><b>Existing Writers:</b><br>'; for(let k in writersCache){h+=`👤 ${k} | Pass: ${writersCache[k]}<br>`;} document.getElementById('writerList').innerHTML=h;}
async function createWriter(){
 let token=document.getElementById('gtoken').value.trim(); if(!token){alert('Pehle Token dalo');return;} localStorage.setItem('gh_token',token);
 let name=document.getElementById('wname').value.trim(); if(!name){alert('Naam likho');return;}
 let id=name.toLowerCase().replace(/\s+/g,'')+'_writer'; let pass=name.charAt(0).toUpperCase()+name.slice(1)+'@'+Math.floor(100+Math.random()*900)+'!';
 await loadWriters(); writersCache[id]=pass;
 let content=btoa(unescape(encodeURIComponent(JSON.stringify(writersCache,null,2))));
 let url=`https://api.github.com/repos/mannu-gola/gold-price-today/contents/writers.json`;
 let body={message:`Add writer ${id}`, content:content}; if(writersSha) body.sha=writersSha;
 document.getElementById('wout').innerText='Saving...';
 let res=await fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(res.ok){document.getElementById('wout').innerHTML=`✅ Ban Gaya!<br>ID: <b>${id}</b><br>Pass: <b>${pass}</b><br><br>Writer ko ye de do, turant login hoga!`; listWriters(); writersSha=(await res.json()).content.sha;}else{document.getElementById('wout').innerText='Error: Token galat hai ya writers.json me {} nahi hai';}
}
async function publishDirect(){let token=document.getElementById('gtoken').value.trim(); let slug=document.getElementById('slug').value.trim(); if(!slug.endsWith('.html'))slug+='.html'; let html=getHtml(); let url=`https://api.github.com/repos/mannu-gola/gold-price-today/contents/blog/${slug}`; let res=await fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Admin publish '+slug, content:btoa(unescape(encodeURIComponent(html)))})}); document.getElementById('msg').innerText=res.ok?'🎉 LIVE Ho Gaya!':'Error: File naam badlo';}
async function sendPending(){let token=document.getElementById('gtoken').value.trim(); if(!token){token=prompt('GitHub Token dalo'); if(!token)return;} let slug=document.getElementById('slug').value.trim(); if(!slug.endsWith('.html'))slug+='.html'; let html=getHtml(); let url=`https://api.github.com/repos/mannu-gola/gold-price-today/contents/pending/${slug}`; let res=await fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:`Writer ${currentUser} pending ${slug}`, content:btoa(unescape(encodeURIComponent(html)))})}); document.getElementById('msg').innerText=res.ok?'✅ Admin ko bhej diya approval ke liye!':'Error';}
</script></body></html>
