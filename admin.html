<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Price News - PRO Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4a017;--black:#0f172a;--dark:#1e293b}
*{box-sizing:border-box;font-family:Inter,Arial}
body{margin:0;background:#f1f5f9;display:flex;min-height:100vh}
#loginPage{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:99}
.loginBox{background:#fff;padding:30px;border-radius:16px;width:90%;max-width:380px;text-align:center}
.loginBox input{width:100%;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:10px}
.btn{padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.btn-gold{background:var(--gold);color:#000;width:100%}
.btn-green{background:#16a34a;color:#fff}.btn-red{background:#fff;border:1px solid #ef4444;color:#ef4444}
.btn-black{background:#000;color:#fff;width:100%}
/* Sidebar */
.sidebar{width:260px;background:var(--black);color:#fff;padding:20px 12px;position:fixed;top:0;left:0;bottom:0;display:none;flex-direction:column}
.sidebar.show{display:flex}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:25px}
.logo b{color:var(--gold);line-height:1.1}
.menu a{display:flex;gap:10px;padding:12px 14px;border-radius:10px;color:#cbd5e1;text-decoration:none;margin:4px 0;cursor:pointer}
.menu a.active,.menu a:hover{background:#d4a01722;color:var(--gold)}
.main{margin-left:0;flex:1;padding:15px;padding-bottom:80px;width:100%}
@media(min-width:900px){.sidebar{position:sticky;top:0;height:100vh}.main{margin-left:0}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 20px #00000008}
.kpi{font-size:28px;font-weight:800}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-green{background:#dcfce7;color:#166534}.badge-orange{background:#ffedd5;color:#9a3412}
.input{width:100%;padding:13px;border:1px solid #e2e8f0;border-radius:12px;margin:8px 0}
label{font-weight:700;font-size:13px;margin-top:12px;display:block}
.dash{border:2px dashed #d4a017;background:#fffbeb}
.hide{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
canvas{width:100%;height:140px}
.mobMenu{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#0f172a;border-radius:30px;display:flex;gap:5px;padding:8px;z-index:20}
.mobMenu button{background:transparent;color:#fff;border:0;padding:10px 14px;border-radius:20px}
.mobMenu button.active{background:var(--gold);color:#000}
</style>
</head>
<body>

<div id="loginPage"><div class="loginBox">
<h2>🔐 PRO Admin Login</h2>
<input id="uid" placeholder="ID"><input id="upass" type="password" placeholder="Password">
<button class="btn btn-gold" onclick="login()">Login</button>
<p id="err" style="color:red"></p>
</div></div>

<div class="sidebar" id="side">
<div class="logo"><div style="width:38px;height:38px;background:var(--gold);border-radius:50%;display:grid;place-items:center">🐂</div><b>GOLD PRICE<br>NEWS<br><span style="font-size:10px;color:#94a3b8;font-weight:400">ADMIN CMS — PRO</span></b></div>
<div class="menu">
<a id="m-dash" class="active" onclick="tab('dash')">📊 Dashboard</a>
<a id="m-posts" onclick="tab('posts')">📝 Posts</a>
<a id="m-writers" onclick="tab('writers')">👥 Writers</a>
<a id="m-pending" onclick="tab('pending')">⏳ Pending</a>
<a id="m-seo" onclick="tab('seo')">🔍 SEO</a>
</div>
<div style="margin-top:auto;padding-top:15px;border-top:1px solid #1e293b;display:flex;gap:10px;align-items:center">
<img src="https://i.pravatar.cc/100" style="width:36px;border-radius:50%"><div><div id="userShow" style="font-size:13px;font-weight:700"></div><small style="color:#94a3b8">Editor — Admin</small></div><span onclick="location.reload()" style="margin-left:auto;cursor:pointer">⎋</span>
</div>
</div>

<div class="main" id="mainContent">

<!-- DASHBOARD -->
<div id="tab-dash">
<div class="topbar"><h2 style="margin:0">Dashboard</h2><small id="dateNow"></small></div>
<div class="card">
<b>Analytics: Views (Last 7 Days)</b>
<div class="kpi">23.4K views <span style="font-size:13px;color:green">+12.8% vs last week ↗</span></div>
<canvas id="chart"></canvas>
<div class="grid2" style="margin-top:10px"><div>⏱️ Avg. Read Time:<br><b>3m 42s</b></div><div>
