<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mannu</title>
<style>
body{background:#f5f5f5;font-family:Arial;padding:15px;margin:0}
.box{max-width:500px;background:#fff;margin:30px auto;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:12px;background:#ff9800;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:16px}
.hide{display:none}
</style>
</head>
<body>
<div class="box" id="loginBox">
<h2 style="text-align:center">🔐 Admin Login</h2>
<input id="uid" placeholder="ID likho">
<input id="upass" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
</div>

<div class="box hide" id="panelBox">
<h2 style="text-align:center">📝 New Article</h2>
<input id="author" value="Manish Kumar">
<input id="title" placeholder="Title - jaise Aaj Sone Ka Bhav">
<textarea id="content" rows="8" placeholder="Article yahan likho..."></textarea>
<input id="slug" placeholder="File naam - jaise sone-ka-bhav.html">
<button onclick="makeCode()">Code Banao & Copy Karo</button>
<textarea id="output" rows="10" class="hide" style="margin-top:15px"></textarea>
<p id="msg" style="text-align:center;color:green"></p>
</div>

<script>
function doLogin(){
  let id=document.getElementById("uid").value.trim();
  let pass=document.getElementById("upass").value.trim();
  if(id==="mannu gola" && pass==="baghenia@7409"){
    document.getElementById("loginBox").classList.add("hide");
    document.getElementById("panelBox").classList.remove("hide");
  }else{
    alert("Galat ID Password!");
  }
}
function makeCode(){
  let t=document.getElementById("title").value;
  let c=document.getElementById("content").value.replace(/\n/g,"<br>");
  let a=document.getElementById("author").value;
  let s=document.getElementById("slug").value;
  if(!t||!c||!s){alert("Title, Content, File naam sab bharo");return;}
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${t}</title></head><body style="font-family:Arial;max-width:800px;margin:auto;padding:20px"><h1>${t}</h1><p><small>By ${a} | ${new Date().toLocaleDateString()}</small></p><div style="line-height:1.7">${c}</div><br><a href="/">← Home</a></body></html>`;
  let out=document.getElementById("output");
  out.classList.remove("hide");
  out.value=html;
  navigator.clipboard.writeText(html);
  document.getElementById("msg").innerText="✅ Copy ho gaya! Ab blog folder me paste kar do";
}
</script>
</body>
</html>
