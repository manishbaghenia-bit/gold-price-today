<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Gold Price Today</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{background:#f0f2f5;padding:14px}
.box{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:500px;margin:auto}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:14px}
button{background:#e11d48;color:#fff;font-weight:700;border:none;cursor:pointer}
img#preview{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-top:10px;display:none;background:#eee}
.list .news{background:#fff;margin:10px 0;border-radius:10px;display:flex;gap:10px;padding:10px}
</style>
</head>
<body>
<div class="box">
<h2>⚙️ Admin Panel</h2>
<p style="font-size:12px;color:#666">Yaha se news daalo, turant website pe dikhegi</p>

<input id="title" placeholder="News Title likho - Ex: Sona 1000 rupya mehnga">
<select id="cat"><option>GOLD NEWS</option><option>SILVER NEWS</option><option>MARKET NEWS</option></select>
<input type="file" id="file" accept="image/*">
<img id="preview">
<input type="hidden" id="imgData">

<button onclick="addNews()">+ Publish News</button>
<a href="index.html" style="display:block;text-align:center;margin-top:10px;text-decoration:none;color:#000;font-weight:700">← Website Dekho</a>

<hr style="margin:16px 0">
<h3>Tumhari Daali Hui News</h3>
<div id="myList"></div>
<button onclick="clearAll()" style="background:#000;margin-top:10px">Sab Delete Karo</button>
</div>

<script>
let imgBase64="";
document.getElementById('file').addEventListener('change', e=>{
 let reader=new FileReader();
 reader.onload=()=>{
   imgBase64=reader.result;
   document.getElementById('preview').src=imgBase64;
   document.getElementById('preview').style.display='block';
 };
 reader.readAsDataURL(e.target.files[0]);
});

function addNews(){
 let t=document.getElementById('title').value;
 if(!t){alert('Title likho');return;}
 let n={title:t, cat:document.getElementById('cat').value+" • ABHI", img: imgBase64 || "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Gold_bars.jpg/400px-Gold_bars.jpg"};
 let arr=JSON.parse(localStorage.getItem('myGoldNews')||'[]');
 arr.push(n);
 localStorage.setItem('myGoldNews', JSON.stringify(arr));
 document.getElementById('title').value=""; alert('Publish ho gayi! Ab Home pe dekho');
 showMy();
}

function showMy(){
 let arr=JSON.parse(localStorage.getItem('myGoldNews')||'[]');
 document.getElementById('myList').innerHTML=arr.reverse().map((n,i)=>`
 <div class="news"><img src="${n.img}" style="width:60px;height:50px;border-radius:6px;object-fit:cover"><div style="font-size:12px;font-weight:700">${n.title}</div></div>`).join('') || 'Koi news nahi';
}
function clearAll(){ if(confirm('Pakka delete?')){localStorage.removeItem('myGoldNews'); showMy();}}
showMy();
</script>
</body>
</html>
