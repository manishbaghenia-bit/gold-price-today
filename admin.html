<script>
// REAL COUNTER - No more dummy
async function showRealViews(){
  try {
    const r = await fetch('https://api.countapi.xyz/get/gold-price-today-eight-2026/visits');
    const d = await r.json();
    document.getElementById('viewCount').innerText = d.value || 0;
  } catch {
    document.getElementById('viewCount').innerText = "0 - API connect ho raha hai";
  }
}
showRealViews();
</script>
